AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Hopecard → Athena → PowerBI event-driven refresh pipeline.
  Trigger: S3 object created in the raw Hopecard Parquet prefix.
  Action:  SQS debounce (120 s batch window) → Lambda → Athena CTAS → PowerBI refresh.

# ══════════════════════════════════════════════════════════════════════════════
# Parameters — override at deploy time:
#   aws cloudformation deploy \
#     --template-file cloudformation.yaml \
#     --stack-name hopecard-pipeline \
#     --parameter-overrides \
#         RawBucket=my-data-lake \
#         ResultsBucket=my-data-lake \
#         AthenaDatabase=results_db \
#         AthenaResultsPrefix=athena-query-results \
#         PowerBISecretName=powerbi/refresh-credentials \
#         LambdaCodeBucket=my-lambda-artifacts \
#         LambdaCodeKey=hopecard-pipeline/lambda.zip
# ══════════════════════════════════════════════════════════════════════════════

Parameters:

  RawBucket:
    Type: String
    Description: S3 bucket where the Kafka consumer writes raw Hopecard Parquet files.

  ResultsBucket:
    Type: String
    Description: >
      S3 bucket where Athena CTAS writes PowerBI-ready Parquet files.
      Can be the same as RawBucket.

  AthenaDatabase:
    Type: String
    Default: results_db
    Description: Glue database that holds the pbi_* tables.

  AthenaResultsPrefix:
    Type: String
    Default: athena-query-results
    Description: S3 prefix for Athena query result files (not the PowerBI data).

  PowerBISecretName:
    Type: String
    Default: powerbi/refresh-credentials
    Description: >
      Secrets Manager key containing Power BI OAuth2 credentials.
      JSON shape: { tenant_id, client_id, client_secret, dataset_id, group_id }

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket holding the zipped Lambda deployment package.

  LambdaCodeKey:
    Type: String
    Default: hopecard-pipeline/lambda.zip
    Description: S3 key of the Lambda zip file.

  SQSBatchWindowSeconds:
    Type: Number
    Default: 120
    MinValue: 0
    MaxValue: 300
    Description: >
      Seconds SQS waits to accumulate messages before firing the Lambda.
      120 s absorbs burst Kafka writes without spawning one Athena job per file.

  LambdaTimeoutSeconds:
    Type: Number
    Default: 540
    Description: >
      Lambda timeout. Must exceed the longest expected Athena job runtime.
      Athena CTAS across 6 tables should complete in < 5 min on typical data.

  NotificationEmail:
    Type: String
    Default: ''
    Description: (Optional) Email for CloudWatch alarm notifications.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]


# ══════════════════════════════════════════════════════════════════════════════
# Resources
# ══════════════════════════════════════════════════════════════════════════════

Resources:

  # ── Dead Letter Queue — captures SQS messages that Lambda repeatedly fails ──

  RefreshDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hopecard-pipeline-refresh-dlq
      MessageRetentionPeriod: 1209600   # 14 days — time to investigate failures
      KmsMasterKeyId: alias/aws/sqs

  # ── Main SQS queue — receives S3 events, debounces burst writes ─────────────

  RefreshQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hopecard-pipeline-refresh
      VisibilityTimeout: 600            # must be >= Lambda timeout
      MessageRetentionPeriod: 86400     # 1 day
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RefreshDLQ.Arn
        maxReceiveCount: 3              # retry 3 times before DLQ

  RefreshQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref RefreshQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToSend
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt RefreshQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/*'

  # ── EventBridge rule: S3 object created in the raw Hopecard prefix ──────────
  # Requires "EventBridge notifications" enabled on the S3 bucket.
  # In the console: S3 bucket → Properties → Event notifications → EventBridge → On

  S3EventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: hopecard-raw-parquet-created
      Description: Fires when a new Parquet file lands in the raw Hopecard S3 prefix.
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref RawBucket
          object:
            key:
              - prefix: raw/hopecard-events/
      Targets:
        - Id: RefreshQueueTarget
          Arn: !GetAtt RefreshQueue.Arn

  # ── IAM role for the Lambda ─────────────────────────────────────────────────

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hopecard-pipeline-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: hopecard-pipeline-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # SQS — read and delete messages from the main queue
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt RefreshQueue.Arn

              # Athena — run queries and poll results
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                Resource: '*'

              # Glue — describe and delete table entries (for DROP TABLE)
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetDatabase
                  - glue:CreateTable
                  - glue:DeleteTable
                  - glue:UpdateTable
                  - glue:GetPartitions
                  - glue:BatchDeletePartition
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${AthenaDatabase}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${AthenaDatabase}/*'

              # S3 — read raw data + write/delete results + write Athena query outputs
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::${RawBucket}'
                  - !Sub 'arn:aws:s3:::${RawBucket}/*'
                  - !Sub 'arn:aws:s3:::${ResultsBucket}'
                  - !Sub 'arn:aws:s3:::${ResultsBucket}/*'

              # Secrets Manager — read Power BI credentials
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${PowerBISecretName}*'

              # KMS — decrypt SQS and Secrets Manager data
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService:
                      - !Sub 'sqs.${AWS::Region}.amazonaws.com'
                      - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'

  # ── Lambda function ─────────────────────────────────────────────────────────

  RefreshLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: hopecard-pipeline-refresh
      Description: >
        Triggered by SQS (S3 Parquet arrival). Runs Athena CTAS to refresh
        PowerBI-ready result tables, then calls the Power BI refresh API.
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: !Ref LambdaTimeoutSeconds
      MemorySize: 256                    # 256 MB is sufficient — all compute is in Athena
      ReservedConcurrentExecutions: 1   # serialise refreshes; only 1 at a time
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key:    !Ref LambdaCodeKey
      Environment:
        Variables:
          ATHENA_DATABASE:    !Ref AthenaDatabase
          ATHENA_RESULTS_S3:  !Sub 's3://${ResultsBucket}/${AthenaResultsPrefix}/'
          RESULTS_BUCKET:     !Ref ResultsBucket
          POWERBI_SECRET_NAME: !Ref PowerBISecretName
          AWS_REGION_NAME:    !Ref AWS::Region
          FORCE_REFRESH_ALL:  'false'
      Layers: []

  # ── Wire SQS → Lambda (with debounce batch window) ─────────────────────────

  LambdaSQSTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt RefreshQueue.Arn
      FunctionName:   !GetAtt RefreshLambda.Arn
      BatchSize:      100              # absorb up to 100 S3 events per invocation
      MaximumBatchingWindowInSeconds: !Ref SQSBatchWindowSeconds
      FunctionResponseTypes:
        - ReportBatchItemFailures      # partial-batch failure support

  # ── CloudWatch Log Group with 30-day retention ──────────────────────────────

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:     !Sub '/aws/lambda/${RefreshLambda}'
      RetentionInDays:  30

  # ── CloudWatch Alarms ───────────────────────────────────────────────────────

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: hopecard-pipeline-alerts
      Subscriptions:
        - !If
          - HasNotificationEmail
          - Protocol: email
            Endpoint: !Ref NotificationEmail
          - !Ref AWS::NoValue

  AlarmLambdaErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:          hopecard-pipeline-lambda-errors
      AlarmDescription:   Lambda refresh function is throwing errors.
      Namespace:          AWS/Lambda
      MetricName:         Errors
      Dimensions:
        - Name:  FunctionName
          Value: !Ref RefreshLambda
      Statistic:          Sum
      Period:             300          # 5-minute window
      EvaluationPeriods:  1
      Threshold:          1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData:   notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  AlarmDLQDepth:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:          hopecard-pipeline-dlq-messages
      AlarmDescription:   Messages are accumulating in the DLQ — refresh failures need investigation.
      Namespace:          AWS/SQS
      MetricName:         ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name:  QueueName
          Value: !GetAtt RefreshDLQ.QueueName
      Statistic:          Sum
      Period:             60
      EvaluationPeriods:  1
      Threshold:          1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData:   notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  AlarmLambdaTimeout:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:          hopecard-pipeline-lambda-duration
      AlarmDescription:   Lambda is running close to its timeout — Athena queries may be slow.
      Namespace:          AWS/Lambda
      MetricName:         Duration
      Dimensions:
        - Name:  FunctionName
          Value: !Ref RefreshLambda
      ExtendedStatistic:  p95
      Period:             300
      EvaluationPeriods:  3
      Threshold:          480000       # alert at 480 s (80% of 540 s timeout)
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData:   notBreaching
      AlarmActions:
        - !Ref AlarmTopic


# ══════════════════════════════════════════════════════════════════════════════
# Outputs
# ══════════════════════════════════════════════════════════════════════════════

Outputs:

  RefreshQueueUrl:
    Value: !Ref RefreshQueue
    Description: SQS queue URL — point S3 EventBridge rule here.

  RefreshQueueArn:
    Value: !GetAtt RefreshQueue.Arn

  DLQUrl:
    Value: !Ref RefreshDLQ
    Description: Dead-letter queue for failed refresh events.

  LambdaArn:
    Value: !GetAtt RefreshLambda.Arn

  LambdaLogGroup:
    Value: !Ref LambdaLogGroup
    Description: CloudWatch log group for the refresh Lambda.

  AlertTopicArn:
    Value: !Ref AlarmTopic
    Description: SNS topic for pipeline failure alerts.
